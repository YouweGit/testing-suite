imports:
  - resource: '../default/grumphp.yml'

# Extend git triggers with common Drupal constructs
parameters:
  git_blacklist.triggered_by: [ 'php', 'js', 'twig' ]

  # securitychecker.ignore_list: {"CVE-1234": "<jira ticket>"}  # Add a jira ticket indicating when this vulnerability
  #                                                             # will be fixed (update/upgrade will be performed).
  #                                                             # Within that ticket explain this (new) vulnerability.

grumphp:
  tasks:
    phpcs:
      ignore_patterns:
        - /^build\//
        - /^drush\//
        - /^\.ddev\//